<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-label="Simon-Pierre Boucher — Finance, Econometrics, AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.55" stop-color="#0d1533"/>
      <stop offset="1" stop-color="#1a0f3a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.75" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="r"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <style>
    .name{font:700 62px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-1.5px;fill:url(#ink)}
    .tag{font:500 23px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#cbd5e1}
    .sub{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8}
    .dot{fill:#34d399}
    .series{fill:none;stroke:url(#line);stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:2600;stroke-dashoffset:2600;animation:draw 5s ease-out forwards}
    .area{opacity:0;animation:fade 2s ease-in 3.2s forwards}
    .cur{fill:#a78bfa;animation:blink 1.1s steps(2) infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    .up{opacity:0;animation:rise .9s ease-out forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.2s}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{to{opacity:1}}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{50%{opacity:.35;transform:scale(1.6)}}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.series{animation:none;stroke-dashoffset:0}.area,.up{animation:none;opacity:1}.cur,.pulse{animation:none}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="980" cy="60" r="330" fill="url(#glow)"/>
    <path class="area" fill="url(#fill)" d="M0 328 L40 322 L80 326 L120 314 L160 318 L200 304 L240 310 L280 292 L320 299 L360 280 L400 288 L440 296 L480 274 L520 281 L560 258 L600 268 L640 246 L680 256 L720 263 L760 238 L800 248 L840 222 L880 234 L920 210 L960 220 L1000 194 L1040 206 L1080 180 L1120 190 L1160 164 L1200 172 L1200 340 L0 340 Z"/>
    <path class="series" d="M0 328 L40 322 L80 326 L120 314 L160 318 L200 304 L240 310 L280 292 L320 299 L360 280 L400 288 L440 296 L480 274 L520 281 L560 258 L600 268 L640 246 L680 256 L720 263 L760 238 L800 248 L840 222 L880 234 L920 210 L960 220 L1000 194 L1040 206 L1080 180 L1120 190 L1160 164 L1200 172"/>
    <g class="up d1"><text class="name" x="64" y="118">Simon-Pierre Boucher</text></g>
    <g class="up d2">
      <text class="tag" x="66" y="166">Finance · Econometrics · AI</text>
      <rect class="cur" x="452" y="146" width="12" height="24" rx="2"/>
    </g>
    <g class="up d3">
      <circle class="dot pulse" cx="72" cy="203" r="5"/>
      <circle class="dot" cx="72" cy="203" r="5"/>
      <text class="sub" x="88" y="209">Professor at UQO · financial econometrics researcher · macOS / AI developer</text>
    </g>
  </g>
</svg>
